<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />

    <title>NAS100 Trade Journal</title>
    <style></style>
  </head>
  <body>
    <div class="container">
      <h1>📊 NAS100 Trade Journal</h1>
      <p class="subtitle">
        Paper Trading Session Tracker - Structure & Liquidity Breakout Strategy
      </p>

      <div class="controls">
        <button class="btn-primary" onclick="addTrade()">+ New Trade</button>
        <button class="btn-success" onclick="exportToCSV()">
          📥 Export to CSV
        </button>
        <button class="btn-danger" onclick="clearAllTrades()">
          🗑️ Clear All
        </button>
      </div>

      <div class="stats">
        <div class="stat-card">
          <div class="stat-label">Total Trades</div>
          <div class="stat-value" id="totalTrades">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Win Rate</div>
          <div class="stat-value" id="winRate">0%</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total P&L (Points)</div>
          <div class="stat-value" id="totalPL">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Avg R:R</div>
          <div class="stat-value" id="avgRR">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Rules Followed</div>
          <div class="stat-value" id="rulesFollowed">0%</div>
        </div>
      </div>

      <div class="table-container">
        <table id="tradeTable">
          <thead>
            <tr>
              <th>Date</th>
              <th>Time</th>
              <th>Direction</th>
              <th>Entry</th>
              <th>Stop</th>
              <th>TP1</th>
              <th>TP2</th>
              <th>Exit</th>
              <th>P&L (pts)</th>
              <th>R:R</th>
              <th>Followed Rules?</th>
              <th>Notes</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="tradeBody">
            <!-- Trades will be added here -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Add Trade Modal -->
    <div id="tradeModal" class="modal">
      <div class="modal-content">
        <h2>Add New Trade</h2>

        <div class="form-group">
          <label>Date</label>
          <input type="date" id="tradeDate" required />
        </div>

        <div class="form-group">
          <label>Time (Entry)</label>
          <input type="time" id="tradeTime" required />
        </div>

        <div class="form-group">
          <label>Direction</label>
          <select id="tradeDirection">
            <option value="LONG">LONG</option>
            <option value="SHORT">SHORT</option>
          </select>
        </div>

        <div class="form-group">
          <label>Entry Price</label>
          <input
            type="number"
            id="entryPrice"
            step="0.01"
            placeholder="17850.50"
            required
          />
        </div>

        <div class="form-group">
          <label>Stop Loss</label>
          <input
            type="number"
            id="stopLoss"
            step="0.01"
            placeholder="17820.00"
            required
          />
        </div>

        <div class="form-group">
          <label>Take Profit 1 (2:1)</label>
          <input type="number" id="tp1" step="0.01" placeholder="17910.50" />
        </div>

        <div class="form-group">
          <label>Take Profit 2 (3:1)</label>
          <input type="number" id="tp2" step="0.01" placeholder="17940.00" />
        </div>

        <div class="form-group">
          <label>Actual Exit Price</label>
          <input
            type="number"
            id="exitPrice"
            step="0.01"
            placeholder="17910.50"
            required
          />
        </div>

        <div class="form-group">
          <label>Pre-Trade Checklist (Check all that apply)</label>
          <div class="checkbox-group">
            <div class="checkbox-label">
              <input type="checkbox" class="rule-check" id="check1" />
              <label for="check1">1H Trend Confirmed</label>
            </div>
            <div class="checkbox-label">
              <input type="checkbox" class="rule-check" id="check2" />
              <label for="check2">Liquidity Sweep</label>
            </div>
            <div class="checkbox-label">
              <input type="checkbox" class="rule-check" id="check3" />
              <label for="check3">BOS Confirmed</label>
            </div>
            <div class="checkbox-label">
              <input type="checkbox" class="rule-check" id="check4" />
              <label for="check4">Pullback Entry</label>
            </div>
            <div class="checkbox-label">
              <input type="checkbox" class="rule-check" id="check5" />
              <label for="check5">Risk = 1%</label>
            </div>
            <div class="checkbox-label">
              <input type="checkbox" class="rule-check" id="check6" />
              <label for="check6">No Major News</label>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>Trade Notes / Lessons</label>
          <textarea
            id="tradeNotes"
            rows="3"
            placeholder="What went well? What could be improved?"
          ></textarea>
        </div>

        <div class="modal-actions">
          <button class="btn-danger" onclick="closeModal()">Cancel</button>
          <button class="btn-success" onclick="saveTrade()">Save Trade</button>
        </div>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
